<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Rounded-rect background -->
  <rect x="1" y="1" width="46" height="46" rx="12" fill="#0f3c35"/>
  <!-- Line 1: full-width straight (top) -->
  <line x1="10" y1="15" x2="38" y2="15" stroke="#dff2ef" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Line 2: routes down-right — the "flow" -->
  <path d="M10 24 L26 24 Q32 24 34 28 L38 33" stroke="#25a18e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Line 3: short stub, lower-left -->
  <line x1="10" y1="33" x2="24" y2="33" stroke="#dff2ef" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Endpoint dot — the "resolved" moment -->
  <circle cx="38" cy="33" r="3" fill="#25a18e"/>
</svg>
